spring.application.name=worklog-ai
spring.config.import=optional:file:.env.properties
spring.datasource.url=jdbc:h2:file:./data/worklog;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
worklog.admin.username=${WORKLOG_ADMIN_USERNAME:admin}
worklog.admin.password=${WORKLOG_ADMIN_PASSWORD:}
worklog.admin.display-name=${WORKLOG_ADMIN_DISPLAY_NAME:\uB0B4 Worklog}
