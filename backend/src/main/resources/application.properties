spring.application.name=worklog-ai
spring.profiles.default=local
spring.config.import=optional:file:.env.properties
spring.jpa.open-in-view=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
worklog.admin.username=${WORKLOG_ADMIN_USERNAME:admin}
worklog.admin.password=${WORKLOG_ADMIN_PASSWORD:}
worklog.admin.display-name=${WORKLOG_ADMIN_DISPLAY_NAME:\uB0B4 Worklog}
