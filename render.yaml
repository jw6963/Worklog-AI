services:
  - type: web
    name: worklog-ai
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeployTrigger: checksPass
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        sync: false
      - key: WORKLOG_ADMIN_USERNAME
        value: admin
      - key: WORKLOG_ADMIN_PASSWORD
        sync: false
      - key: WORKLOG_ADMIN_DISPLAY_NAME
        value: Worklog Admin
